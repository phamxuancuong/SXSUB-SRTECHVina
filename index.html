<script>
const EMBEDDED_FALLBACK = {
  ontime: [
    { year: 2026, month: 11, week: 46, date: "2026-11-13", dow: "Fri", plan: 2150000, ok: 2150000, ng: 0, rate: 1, status: "ON" }
  ],
  ckd_pcell: [
    { year: 2026, month: 11, week: 46, date: "2026-11-13", dow: "Fri", plan: 45115, ok: 45115, ng: 0, rate: 1, status: "ON" }
  ],
  ml_svc: [
    { year: 2026, month: 11, week: 46, date: "2026-11-13", dow: "Fri", plan: 32514, ok: 32514, ng: 0, rate: 1, status: "ON" }
  ],
  po_ontime: [],
  po_ckd_pcell: [],
  po_svc: []
};


let DB = null;
let KPI_DB = null;
let isServerMode = false;
let viewStack = [];

async function syncToServer() {
  if (!isServerMode) return false;
  const resp = await fetch("/api/save", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ db: DB, kpi: KPI_DB })
  });
  if (!resp.ok) throw new Error("Lưu lên server thất bại");
  return true;
}

function loadKpiFromStorageOrFallback() {
  try {
    const savedKpi = localStorage.getItem("SR_SUB_KPI_DB");
    if (savedKpi) {
      const parsed = JSON.parse(savedKpi);
      if (parsed && parsed.sections) {
        return parsed;
      }
    }
  } catch (e) {}
  return {
    version: 1,
    sections: {
      FRONT: [],
      PRE_FRONT: [],
      BGL_SUB_UB: [],
      OTHER: [],
      SUB: [],
      MOLDING: [],
      G_TOTAL: []
    },
    targets: {
      sub_week: 28,
      total_week: 30,
      next_week_target: "30"
    }
  };
}

let statusClockTimer = null;

function formatLiveDateTime(date = new Date()) {
  const pad = n => String(n).padStart(2, "0");
  const hours = pad(date.getHours());
  const minutes = pad(date.getMinutes());
  const seconds = pad(date.getSeconds());
  const day = pad(date.getDate());
  const month = pad(date.getMonth() + 1);
  const year = date.getFullYear();
  return `${hours}:${minutes}:${seconds} ${day}/${month}/${year}`;
}

function startLiveStatusBadge(prefixText = "Online") {
  const badge = document.getElementById("connStatus");
  if (!badge) return;

  const renderText = () => {
    badge.textContent = `${prefixText} | ${formatLiveDateTime()}`;
  };

  renderText();
  if (statusClockTimer) clearInterval(statusClockTimer);
  statusClockTimer = setInterval(renderText, 1000);
}

async function initApp() {
  const badge = document.getElementById("connStatus");
  if (window.location.protocol === "file:") {
    loadOfflineMode(badge);
    return;
  }
  try {
    const resp = await fetch("/api/data");
    if (!resp.ok) throw new Error("Server offline");
    const payload = await resp.json();
    if (payload.error) throw new Error(payload.error);
    DB = payload.db || JSON.parse(JSON.stringify(EMBEDDED_FALLBACK));
    KPI_DB = payload.kpi || loadKpiFromStorageOrFallback();
    localStorage.setItem("SR_SUB_OFFLINE_DB", JSON.stringify(DB));
    localStorage.setItem("SR_SUB_KPI_DB", JSON.stringify(KPI_DB));
    isServerMode = true;
    startLiveStatusBadge("Server Online");
  } catch (e) {
    loadOfflineMode(badge);
  }
  switchTab("tab1");
}

function loadOfflineMode(badge) {
  const saved = localStorage.getItem("SR_SUB_OFFLINE_DB");
  DB = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(EMBEDDED_FALLBACK));
  KPI_DB = loadKpiFromStorageOrFallback();
  isServerMode = false;
  startLiveStatusBadge("Online");
  switchTab("tab1");
}

function formatPct(rate) {
  if (rate === null || rate === undefined || isNaN(rate)) return "-";
  const pct = rate * 100;
  return Number.isInteger(pct) ? pct.toFixed(0) + "%" : pct.toFixed(2) + "%";
}

function formatNum(n) {
  return Number(n || 0).toLocaleString("en-US");
}

function formatDec(n, digits = 2) {
  const num = Number(n);
  if (isNaN(num)) return "-";
  return num.toLocaleString("en-US", { minimumFractionDigits: digits, maximumFractionDigits: digits });
}

function safeNum(val) {
  if (val === null || val === undefined || val === "") return 0;
  if (typeof val === "number") return isFinite(val) ? val : 0;
  const s = String(val).trim();
  if (s.startsWith("#")) return 0;
  const cleaned = s.replace(/,/g, "");
  const n = Number(cleaned);
  return isFinite(n) ? n : 0;
}

function getValidRecords(key) {
  return (DB[key] || []).filter(r => (r.plan || 0) > 0);
}

function getRateClass(rate) {
  if (rate === null || rate === undefined || isNaN(rate)) return "";
  if (rate >= 0.999999) return "val-blue";
  if (rate >= 0.99) return "val-orange";
  return "val-red";
}

function getRateHex(rate) {
  if (rate === null || rate === undefined || isNaN(rate)) return "#334155";
  if (rate >= 0.999999) return "#0284c7";
  if (rate >= 0.99) return "#ea580c";
  return "#dc2626";
}

function switchTab(tabId) {
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === tabId);
  });
  viewStack = [];
  if (tabId === "tab1") pushView(renderTab1Ranking);
  if (tabId === "tab2") pushView(renderTab2KPI);
  if (tabId === "tab3") pushView(renderTab3Input);
}

function pushView(renderFn, state = {}) {
  viewStack.push({ renderFn, state });
  renderFn(state);
}

function popView() {
  if (viewStack.length > 1) {
    viewStack.pop();
    const prev = viewStack[viewStack.length - 1];
    prev.renderFn(prev.state);
  }
}

/* =========================================================================
   HÀM XỬ LÝ CHUYỂN ĐỔI EXCEL XOAY NGANG SANG DẠNG CHUẨN (RANKING)
   ========================================================================= */
function parseHorizontalSheet(sheet) {
  const rawRows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
  if (rawRows.length < 6) return [];

  let years = [], months = [], weeks = [], dates = [], dows = [], plans = [], oks = [], ngs = [], statuses = [];
  
  for (let r = 0; r < rawRows.length; r++) {
    const row = rawRows[r];
    const rowTitle = String(row[0] || "").trim().toLowerCase();
    if (rowTitle.includes("year")) years = row;
    else if (rowTitle.includes("month")) months = row;
    else if (rowTitle.includes("week")) weeks = row;
    else if (rowTitle.includes("date")) dates = row;
    else if (rowTitle === "plan") plans = row;
    else if (rowTitle === "ok") oks = row;
    else if (rowTitle.includes("qty ml") || rowTitle.includes("ng")) ngs = row;
    else if (rowTitle.includes("status")) statuses = row;
  }

  const resultRecords = [];
  const maxCols = Math.max(...rawRows.map(row => row.length));

  for (let c = 1; c < maxCols; c++) {
    const planVal = Number(plans[c] || 0);
    const dateValRaw = dates[c];
    
    if (planVal > 0 && dateValRaw !== undefined && dateValRaw !== null && dateValRaw !== "") {
      let formattedDate = "";
      let y = Number(years[c] || 2026);
      let m = Number(months[c] || 11);
      let d = 1;

      if (typeof dateValRaw === "number") {
        const utcDays = Math.floor(dateValRaw - 25569);
        const dateInfo = new Date(utcDays * 86400 * 1000);
        y = dateInfo.getUTCFullYear();
        m = dateInfo.getUTCMonth() + 1;
        d = dateInfo.getUTCDate();
        formattedDate = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      } else if (dateValRaw instanceof Date) {
        y = dateValRaw.getFullYear();
        m = dateValRaw.getMonth() + 1;
        d = dateValRaw.getDate();
        formattedDate = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
      } else {
        const dateStr = String(dateValRaw).trim();
        const parsedD = new Date(dateStr);
        if (!isNaN(parsedD)) {
          y = parsedD.getFullYear();
          m = parsedD.getMonth() + 1;
          d = parsedD.getDate();
          formattedDate = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        } else {
          const dayMatch = dateStr.match(/\b([1-9]|[12][0-9]|3[01])\b/);
          if (dayMatch) d = parseInt(dayMatch[1]);
          formattedDate = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        }
      }

      const okVal = Number(oks[c] || 0);
      const ngVal = Number(ngs[c] || (planVal - okVal));

      resultRecords.push({
        year: y,
        month: m,
        week: Number(weeks[c] || 47),
        date: formattedDate,
        dow: "Mon",
        plan: planVal,
        ok: okVal,
        ng: ngVal,
        rate: planVal > 0 ? okVal / planVal : 1,
        status: String(statuses[c] || "ON")
      });
    }
  }

  return resultRecords.length > 0 ? resultRecords : XLSX.utils.sheet_to_json(sheet);
}

/* =========================================================================
   TAB 1 - RANKING SX SUB (GIỮ NGUYÊN 100%)
   ========================================================================= */
function renderTab1Ranking() {
  const categories = [
    { key: "ontime", label: "Ontime" },
    { key: "ckd_pcell", label: "ML CKD, Pcell" },
    { key: "ml_svc", label: "ML SVC" }
  ];

  let maxDateStr = "";
  categories.forEach(c => {
    const valid = getValidRecords(c.key);
    valid.forEach(r => {
      if (r.date && (!maxDateStr || r.date > maxDateStr)) {
        maxDateStr = r.date;
      }
    });
  });

  let latestWeek = 47;
  let latestYear = 2026;
  if (maxDateStr) {
    const dt = new Date(maxDateStr);
    latestYear = dt.getFullYear();
    latestWeek = Math.ceil((((dt - new Date(dt.getFullYear(), 0, 1)) / 86400000) + new Date(dt.getFullYear(), 0, 1).getDay() + 1) / 7);
  }

  const rowsHtml = categories.map(cat => {
    const valid = getValidRecords(cat.key);
    const weekRows = valid.filter(r => r.year === latestYear && r.week === latestWeek);
    const yearRows = valid.filter(r => r.year === latestYear);

    const wPlan = weekRows.reduce((s, r) => s + (r.plan || 0), 0);
    const wOk = weekRows.reduce((s, r) => s + (r.ok || 0), 0);
    const wRate = wPlan > 0 ? wOk / wPlan : 0;

    const yPlan = yearRows.reduce((s, r) => s + (r.plan || 0), 0);
    const yOk = yearRows.reduce((s, r) => s + (r.ok || 0), 0);
    const yRate = yPlan > 0 ? yOk / yPlan : 0;

    const wColorClass = getRateClass(wRate);
    const yColorClass = getRateClass(yRate);

    return `
      <tr>
        <td class="fw-bold text-left">${cat.label}</td>
        <td class="fw-bold">100%</td>
        <td class="cell-link ${wColorClass}" onclick="openCategoryChart('${cat.key}', '${cat.label}', 'overview')">

/* =========================================================================
   BIỂU ĐỒ CỘT (RANKING & 3 MỤC ĐẦU KPI)
   ========================================================================= */
function openCategoryChart(catKey, catLabel, defaultMode = "overview") {
  pushView(renderCategoryChart, {
    catKey,
    catLabel,
    mode: defaultMode || "overview",
    fromDate: "",
    toDate: ""
  });
}

function aggregateByMode(records, mode, fromDate, toDate) {
  let filtered = records.filter(r => (r.plan || 0) > 0);
  if (fromDate) filtered = filtered.filter(r => r.date >= fromDate);
  if (toDate) filtered = filtered.filter(r => r.date <= toDate);

  const groups = new Map();
  filtered.forEach(r => {
    let groupKey = "";
    let groupLabel = "";
    if (mode === "year") {
      groupKey = `${r.year}`;
      groupLabel = `Năm ${r.year}`;
    } else if (mode === "month") {
      groupKey = `${r.year}-${String(r.month).padStart(2, "0")}`;
      groupLabel = `T${r.month}/${r.year}`;
    } else if (mode === "week") {
      groupKey = `${r.year}-W${String(r.week).padStart(2, "0")}`;
      groupLabel = `W${r.week}`;
    } else {
      groupKey = r.date;
      groupLabel = r.date ? r.date.slice(5) : "";
    }

    if (!groups.has(groupKey)) {
      groups.set(groupKey, { key: groupKey, label: groupLabel, plan: 0, ok: 0, ng: 0, dates: [] });
    }
    const g = groups.get(groupKey);
    g.plan += Number(r.plan || 0);
    g.ok += Number(r.ok || 0);
    g.ng += (r.ng !== undefined ? Number(r.ng || 0) : (Number(r.plan || 0) - Number(r.ok || 0)));
    if (r.date) g.dates.push(r.date);
  });

  let arr = Array.from(groups.values()).sort((a, b) => a.key.localeCompare(b.key));

  if (!fromDate && !toDate) {
    if (arr.length > 7) arr = arr.slice(-7);
  }

  arr.forEach(item => {
    item.rate = item.plan > 0 ? item.ok / item.plan : 1;
  });
  return arr;
}

function groupRecordsByPeriod(records, periodType) {
  const groups = new Map();
  records.forEach(r => {
    let key = "", label = "";
    if (periodType === "year") {
      key = `${r.year}`;
      label = `Năm ${r.year}`;
    } else if (periodType === "month") {
      key = `${r.year}-${String(r.month).padStart(2, "0")}`;
      label = `T${r.month}/${r.year}`;
    } else if (periodType === "week") {
      key = `${r.year}-W${String(r.week).padStart(2, "0")}`;
      label = `W${r.week}`;
    }

    if (!groups.has(key)) {
      groups.set(key, { key, label, plan: 0, ok: 0, ng: 0, dates: [] });
    }
    const g = groups.get(key);
    g.plan += Number(r.plan || 0);
    g.ok += Number(r.ok || 0);
    g.ng += (r.ng !== undefined ? Number(r.ng || 0) : (Number(r.plan || 0) - Number(r.ok || 0)));
    if (r.date) g.dates.push(r.date);
  });

  return Array.from(groups.values())
    .sort((a, b) => a.key.localeCompare(b.key))
    .map(item => ({ ...item, rate: item.plan > 0 ? item.ok / item.plan : 1 }));
}

function buildOverviewSeries(records) {
  const valid = records.filter(r => (r.plan || 0) > 0);
  return [
    ...groupRecordsByPeriod(valid, "year").slice(-1),
    ...groupRecordsByPeriod(valid, "month").slice(-3),
    ...groupRecordsByPeriod(valid, "week").slice(-3)
  ];
}

function renderCategoryChart(state) {

/* =========================================================================
   HÀM XỬ LÝ DỮ LIỆU KPI (SALE PERSON THEO ITEM FILE OK - HỖ TRỢ GỘP Ô & CỘT)
   ========================================================================= */
function parseKpiSheet(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null });
  const sections = {
    FRONT: [],
    PRE_FRONT: [],
    BGL_SUB_UB: [],
    OTHER: [],
    SUB: [],
    MOLDING: [],
    G_TOTAL: []
  };

  if (!rows || rows.length < 15) return sections;

  let currentSecKey = null;
  let actualAttendanceRow = -1;
  const secRowMap = {};

  for (let r = 0; r < rows.length; r++) {
    const c1 = String(rows[r][1] || "").trim().toUpperCase();
    const c2 = String(rows[r][2] || "").trim().toLowerCase();
    const c3 = String(rows[r][3] || "").trim().toLowerCase();

    if (c2.includes("số thực tế")) {
      actualAttendanceRow = r;
    }

    if (c1) {
      if (c1.includes("PRE FRONT") || c1.includes("PRE_FRONT")) currentSecKey = "PRE_FRONT";
      else if (c1.includes("BGL") || c1.includes("SUB UB")) currentSecKey = "BGL_SUB_UB";
      else if (c1 === "FRONT") currentSecKey = "FRONT";
      else if (c1 === "OTHER") currentSecKey = "OTHER";
      else if (c1 === "SUB" && r > 10) currentSecKey = "SUB";
      else if (c1.includes("MOLDING")) currentSecKey = "MOLDING";
      else if (c1.includes("G.TOTAL") || c1.includes("G_TOTAL")) currentSecKey = "G_TOTAL";
    }

    if (currentSecKey) {
      if (!secRowMap[currentSecKey]) secRowMap[currentSecKey] = {};
      if (c3.includes("tổng nhân lực")) secRowMap[currentSecKey].labor = r;
      else if (c3.includes("sum 수량")) secRowMap[currentSecKey].qty = r;
      else if (c3.includes("sum st")) secRowMap[currentSecKey].st = r;
      else if (c3.includes("sum sales")) secRowMap[currentSecKey].sales = r;
      else if (c3 === "sales person") secRowMap[currentSecKey].sp = r;
    }
  }

  if (secRowMap.G_TOTAL && actualAttendanceRow >= 0 && secRowMap.G_TOTAL.labor === undefined) {
    secRowMap.G_TOTAL.labor = actualAttendanceRow;
  }

  const maxCols = Math.max(...rows.map(r => r.length));
  const row5 = rows[4] || [];
  const row6 = rows[5] || [];
  const row7 = rows[6] || [];

  let curYear = 2026;
  let curMonth = 11;
  let curWeek = 47;

  for (let c = 4; c < maxCols; c++) {
    const v5 = row5[c];
    const v6 = row6[c];
    const v7 = row7[c];

    let colType = "";
    let isoDate = "";
    let colLabel = "";

    if (typeof v5 === "number" && v5 >= 2020 && v5 <= 2035) {
      curYear = v5;
      colType = "year";
      colLabel = `Năm ${curYear}`;
    } else if (typeof v5 === "string" && /tháng\s*\d+/i.test(v5)) {
      const mMatch = v5.match(/tháng\s*(\d{1,2})\.(\d{4})/i);
      if (mMatch) {
        curMonth = parseInt(mMatch[1], 10);
        curYear = parseInt(mMatch[2], 10);
      }
      colType = "month";
      colLabel = `T${curMonth}/${curYear}`;
    } else if (typeof v6 === "string" && /^w\d+/i.test(v6.trim())) {
      const wMatch = v6.trim().match(/^w(\d{1,2})(?:\.(\d{4}))?/i);
      if (wMatch) {
        curWeek = parseInt(wMatch[1], 10);
        if (wMatch[2]) curYear = parseInt(wMatch[2], 10);
      }
      colType = "week";
      colLabel = `W${curWeek}`;
    } else {
      const dateCand = v7 !== null && v7 !== undefined ? v7 : v6;
      if (typeof dateCand === "number" && dateCand > 20000) {
        const d = new Date(Math.floor(dateCand - 25569) * 86400 * 1000);
        curYear = d.getUTCFullYear();
        curMonth = d.getUTCMonth() + 1;
        const day = d.getUTCDate();
        isoDate = `${curYear}-${String(curMonth).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        colType = "day";
        colLabel = `${String(curMonth).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      } else if (dateCand instanceof Date && !isNaN(dateCand)) {
        curYear = dateCand.getFullYear();
        curMonth = dateCand.getMonth() + 1;
        const day = dateCand.getDate();
        isoDate = `${curYear}-${String(curMonth).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        colType = "day";
        colLabel = `${String(curMonth).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
      } else if (typeof dateCand === "string" && /^\d{4}-\d{2}-\d{2}/.test(dateCand.trim())) {
        isoDate = dateCand.trim().slice(0, 10);
        const parts = isoDate.split("-");
        curYear = parseInt(parts[0], 10);
        curMonth = parseInt(parts[1], 10);
        colType = "day";
        colLabel = isoDate.slice(5);
      } else {
        continue;
      }
    }

    Object.keys(sections).forEach(secKey => {
      const rmap = secRowMap[secKey];
      if (!rmap || rmap.sp === undefined) return;

      const spVal = safeNum(rows[rmap.sp]?.[c]);
      const qtyVal = rmap.qty !== undefined ? safeNum(rows[rmap.qty]?.[c]) : 0;

      if (spVal > 0 || qtyVal > 0) {
        sections[secKey].push({
          colType,
          year: curYear,
          month: curMonth,
          week: curWeek,
          date: isoDate,
          label: colLabel,
          salesPerson: spVal,
          labor: rmap.labor !== undefined ? safeNum(rows[rmap.labor]?.[c]) : 0,
          qty: qtyVal,
          st: rmap.st !== undefined ? safeNum(rows[rmap.st]?.[c]) : 0,
          sales: rmap.sales !== undefined ? safeNum(rows[rmap.sales]?.[c]) : 0
        });
      }
    });
  }

  return sections;
}

function getKpiPeriodStats(records, year, week) {
  const valid = (records || []).filter(r => safeNum(r.salesPerson) > 0);

  const weekSummary = valid.filter(r => r.colType === "week" && r.year === year && r.week === week);
  let wVal = 0;
  if (weekSummary.length > 0) {
    wVal = safeNum(weekSummary[weekSummary.length - 1].salesPerson);
  } else {
    const weekDays = valid.filter(r => r.colType === "day" && r.year === year && r.week === week);
    if (weekDays.length > 0) {
      wVal = weekDays.reduce((s, r) => s + safeNum(r.salesPerson), 0) / weekDays.length;
    }
  }

  const yearSummary = valid.filter(r => r.colType === "year" && r.year === year);
  let yVal = 0;
  if (yearSummary.length > 0) {
    yVal = safeNum(yearSummary[yearSummary.length - 1].salesPerson);
  } else {
    const yearDays = valid.filter(r => r.colType === "day" && r.year === year);
    if (yearDays.length > 0) {
      yVal = yearDays.reduce((s, r) => s + safeNum(r.salesPerson), 0) / yearDays.length;
    }
  }

  return { wAvg: wVal, yAvg: yVal };
}

function getKpiColorClass(val, target) {
  if (!val || isNaN(val)) return "";
  if (!target || isNaN(target)) return "val-blue";
  if (val >= target) return "val-blue";
  if (val >= target * 0.99) return "val-orange";
  return "val-red";
}

function formatDeltaPct(diffRatio) {
    if (diffRatio === null || diffRatio === undefined || Number.isNaN(diffRatio)) {
      return { text: "-", color: "#64748b" };
    }
    const pctStr = formatPct(Math.abs(diffRatio));
    if (diffRatio > 0) {
      return { text: `+${pctStr}`, color: "#16a34a" }; // Xanh khi cao hơn / tăng
    }
    if (diffRatio < 0) {
      return { text: `-${pctStr}`, color: "#dc2626" }; // Đỏ khi thấp hơn / giảm
    }
    return { text: pctStr, color: "#0f172a" }; // Bằng nhau (0%)
  }
function renderTab2KPI() {
  if (!KPI_DB) {
    KPI_DB = loadKpiFromStorageOrFallback();
  }

  let maxDateStr = "";
  ["ontime", "ckd_pcell", "ml_svc"].forEach(k => {
    getValidRecords(k).forEach(r => {
      if (r.date && (!maxDateStr || r.date > maxDateStr)) maxDateStr = r.date;
    });
  });

  let latestWeek = 47;
  let latestYear = 2026;
  if (maxDateStr) {
    const dt = new Date(maxDateStr);
    latestYear = dt.getFullYear();
    latestWeek = Math.ceil((((dt - new Date(dt.getFullYear(), 0, 1)) / 86400000) + new Date(dt.getFullYear(), 0, 1).getDay() + 1) / 7);
  } else {
    const subWeeks = (KPI_DB.sections?.SUB || []).filter(r => r.colType === "week");
    if (subWeeks.length > 0) {
      const lastW = subWeeks[subWeeks.length - 1];
      latestYear = lastW.year || 2026;
      latestWeek = lastW.week || 47;
    }
  }

  const nextWeek = latestWeek + 1;
  const nextWeekTargetText = (KPI_DB.targets && KPI_DB.targets.next_week_target) ? KPI_DB.targets.next_week_target : "30";

  const topCategories = [
    { key: "ontime", label: "Ontime", targetText: "100%" },
    { key: "ckd_pcell", label: "ML CKD, Pcell", targetText: "100%" },
    { key: "ml_svc", label: "ML SVC", targetText: "100%" }
  ];

  const topRowsHtml = topCategories.map(cat => {
    const valid = getValidRecords(cat.key);
    const weekRows = valid.filter(r => r.year === latestYear && r.week === latestWeek);
    const yearRows = valid.filter(r => r.year === latestYear);

    const wPlan = weekRows.reduce((s, r) => s + (r.plan || 0), 0);
    const wOk = weekRows.reduce((s, r) => s + (r.ok || 0), 0);
    const wRate = wPlan > 0 ? wOk / wPlan : 0;

    const yPlan = yearRows.reduce((s, r) => s + (r.plan || 0), 0);
    const yOk = yearRows.reduce((s, r) => s + (r.ok || 0), 0);
    const yRate = yPlan > 0 ? yOk / yPlan : 0;

    const targetVal = parseFloat(cat.targetText) / 100 || 1;
    const nextTargetVal = parseFloat(cat.targetText) / 100 || 1;

    const wDelta = targetVal > 0 ? (wRate - targetVal) / targetVal : null;
    const nextDelta = wRate > 0 ? (nextTargetVal - wRate) / wRate : null;

    const wDeltaInfo = formatDeltaPct(wDelta);
    const nextDeltaInfo = formatDeltaPct(nextDelta);

    const wCls = getRateClass(wRate);
    const yCls = getRateClass(yRate);

    return `
      <tr>
        <td class="fw-bold text-left">${cat.label}</td>
        <td class="fw-bold">${cat.targetText}</td>

          ${formatPct(yRate)}

      </tr>
    `;
  }).join("");

  const subStats = getKpiPeriodStats(KPI_DB.sections?.SUB || [], latestYear, latestWeek);

  const subTarget = Number(KPI_DB.targets?.sub_week || 28);

  const subNextDelta = (subStats.wAvg > 0 && nextWeekTargetNum > 0) ? ((nextWeekTargetNum - subStats.wAvg) / subStats.wAvg) : null;

  const totWDelta = (totalStats.wAvg > 0 && totalTarget > 0) ? ((totalStats.wAvg - totalTarget) / totalTarget) : null;
  const totNextDelta = (totalStats.wAvg > 0 && nextWeekTargetNum > 0) ? ((nextWeekTargetNum - totalStats.wAvg) / totalStats.wAvg) : null;

  const subWDeltaInfo = formatDeltaPct(subWDelta);
  const subNextDeltaInfo = formatDeltaPct(subNextDelta);
  const totWDeltaInfo = formatDeltaPct(totWDelta);
  const totNextDeltaInfo = formatDeltaPct(totNextDelta);

  const subWCls = getKpiColorClass(subStats.wAvg, subTarget);
  const subYCls = getKpiColorClass(subStats.yAvg, subTarget);
  const totWCls = getKpiColorClass(totalStats.wAvg, totalTarget);
  const totYCls = getKpiColorClass(totalStats.yAvg, totalTarget);

  const kpiRowsHtml = `
    <tr>
      <td class="fw-bold text-left">Sale Per Son SUB</td>
      <td class="fw-bold">${formatDec(subTarget, 0)}</td>
      <td class="cell-link ${subWCls}" onclick="openKpiLineChart('sub_person', 'Sale Per Son SUB', 'overview')">
        ${subStats.wAvg > 0 ? formatDec(subStats.wAvg, 2) : "-"}
      </td>
      <td class="fw-bold" style="color:${subWDeltaInfo.color};">${subWDeltaInfo.text}</td>
      <td class="fw-bold">${nextWeekTargetText}</td>
      <td class="fw-bold" style="color:${subNextDeltaInfo.color};">${subNextDeltaInfo.text}</td>
      <td class="cell-link ${subYCls}" onclick="openKpiLineChart('sub_person', 'Sale Per Son SUB', 'overview')">
        ${subStats.yAvg > 0 ? formatDec(subStats.yAvg, 2) : "-"}
      </td>
    </tr>
    <tr>
      <td class="fw-bold text-left">Sale Per Son SUB Total</td>
      <td class="fw-bold">${formatDec(totalTarget, 0)}</td>
      <td class="cell-link ${totWCls}" onclick="openKpiLineChart('sub_total', 'Sale Per Son SUB Total', 'overview')">
        ${totalStats.wAvg > 0 ? formatDec(totalStats.wAvg, 2) : "-"}
      </td>
      <td class="fw-bold" style="color:${totWDeltaInfo.color};">${totWDeltaInfo.text}</td>
      <td class="fw-bold">${nextWeekTargetText}</td>
      <td class="fw-bold" style="color:${totNextDeltaInfo.color};">${totNextDeltaInfo.text}</td>
      <td class="cell-link ${totYCls}" onclick="openKpiLineChart('sub_total', 'Sale Per Son SUB Total', 'overview')">
        ${totalStats.yAvg > 0 ? formatDec(totalStats.yAvg, 2) : "-"}

    </tr>
    <tr>
      <td class="fw-bold text-left">Hiệu suất Model</td>
      <td colspan="6" class="fw-bold" style="color:#0284c7;">Sớm ra mắt</td>
    </tr>
  `;

  document.getElementById("appMain").innerHTML = `
    <div class="view-container">
      <div class="view-header">
        <div class="view-title">KPI SX SUB</div>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Hạng mục</th>
              <th>Mục tiêu</th>
              <th>Kết quả W${latestWeek}</th>
              <th>Tỷ lệ Đạt W${latestWeek}</th>

            </tr>
          </thead>

}

  sub_person: {
    title: "SALE PER SON SUB",
    items: [
      { key: "FRONT", label: "FRONT", color: "#0284c7" },
      { key: "PRE_FRONT", label: "PRE FRONT", color: "#16a34a" },
      { key: "BGL_SUB_UB", label: "BGL/SUB UB", color: "#ea580c" },

    ]
  },
  sub_total: {
    title: "SALE PER SON SUB TOTAL",
    items: [
      { key: "SUB", label: "SUB", color: "#0284c7" },
      { key: "MOLDING", label: "MOLDING", color: "#ea580c" },
      { key: "G_TOTAL", label: "G.TOTAL", color: "#16a34a" }

function openKpiLineChart(kpiType, kpiLabel, defaultMode = "overview") {
  pushView(renderKpiLineChart, {
    kpiType,
    kpiLabel,
    mode: defaultMode || "overview",
    fromDate: "",
    toDate: ""
  });
}

function getKpiSeriesByMode(records, mode, fromDate, toDate) {
  const all = (records || []).filter(r => safeNum(r.salesPerson) > 0);

  if (mode === "year") {
    const yrs = all.filter(r => r.colType === "year");
    return yrs.slice(-7);
  }
  if (mode === "month") {
    const mths = all.filter(r => r.colType === "month");
    return mths.slice(-7);
  }
  if (mode === "week") {
    const wks = all.filter(r => r.colType === "week");
    return wks.slice(-7);
  }
  let days = all.filter(r => r.colType === "day");
  if (fromDate) days = days.filter(r => r.date && r.date >= fromDate);
  if (toDate) days = days.filter(r => r.date && r.date <= toDate);
  if (!fromDate && !toDate && days.length > 7) {
    days = days.slice(-7);
  }
  return days;
}

function buildKpiOverview(records) {
  const all = (records || []).filter(r => safeNum(r.salesPerson) > 0);
  const yrs = all.filter(r => r.colType === "year").slice(-1);
  const mths = all.filter(r => r.colType === "month").slice(-3);
  const wks = all.filter(r => r.colType === "week").slice(-3);
  return [...yrs, ...mths, ...wks];
}

function renderKpiLineChart(state) {
  const { kpiType, kpiLabel, mode, fromDate, toDate } = state;
  const cfg = KPI_SERIES_CONFIG[kpiType] || KPI_SERIES_CONFIG.sub_person;
  const sections = KPI_DB?.sections || {};

  const modeTitleMap = {
    overview: "TỔNG QUAN",
    year: "THEO NĂM",
    month: "THEO THÁNG",
    week: "THEO TUẦN",
    date: "THEO NGÀY"
  };

  const primarySecKey = kpiType === "sub_total" ? "G_TOTAL" : "SUB";
  const baseSeries = mode === "overview"
    ? buildKpiOverview(sections[primarySecKey] || [])
    : getKpiSeriesByMode(sections[primarySecKey] || [], mode, fromDate, toDate);

  const labels = baseSeries.map(d => d.label);

  const linesData = cfg.items.map(item => {
    const rawSec = sections[item.key] || [];
    const secSeries = mode === "overview"
      ? buildKpiOverview(rawSec)
      : getKpiSeriesByMode(rawSec, mode, fromDate, toDate);

    const mapByLabel = new Map(secSeries.map(x => [x.label, x]));
    const points = labels.map(lbl => {
      const found = mapByLabel.get(lbl);
      return found ? {
        label: lbl,
        val: safeNum(found.salesPerson),
        labor: safeNum(found.labor),
        qty: safeNum(found.qty),
        st: safeNum(found.st),
        sales: safeNum(found.sales)
      } : {
        label: lbl,
        val: 0,
        labor: 0,
        qty: 0,
        st: 0,
        sales: 0
      };
    });
    return { ...item, points };
  });

  state.currentLabels = labels;
  state.currentLinesData = linesData;

  const allVals = linesData.flatMap(l => l.points.map(p => p.val)).filter(v => v > 0);
  const maxVal = allVals.length > 0 ? Math.max(...allVals) * 1.15 : 40;
  const minVal = 0;

  const svgW = 900;
  const svgH = 380;
  const padL = 55;
  const padR = 30;
  const padT = 25;
  const padB = 45;
  const plotW = svgW - padL - padR;
  const plotH = svgH - padT - padB;

  const getX = (i) => {
    if (labels.length <= 1) return padL + plotW / 2;
    return padL + (i / (labels.length - 1)) * plotW;
  };
  const getY = (val) => {
    const ratio = (val - minVal) / (maxVal - minVal || 1);
    return padT + plotH - ratio * plotH;
  };

  let gridSvg = "";
  for (let g = 0; g <= 4; g++) {
    const yPos = padT + (g / 4) * plotH;
    const tickVal = (maxVal - (g / 4) * (maxVal - minVal)).toFixed(0);
    gridSvg += `<line x1="${padL}" y1="${yPos}" x2="${svgW - padR}" y2="${yPos}" stroke="#e2e8f0" stroke-dasharray="4,4" />`;
    gridSvg += `<text x="${padL - 8}" y="${yPos + 4}" text-anchor="end" font-size="11" fill="#64748b">${tickVal}</text>`;
  }

  let pathsSvg = "";
  linesData.forEach(line => {
    const validPts = line.points.map((p, i) => ({ ...p, idx: i })).filter(p => p.val > 0);
    if (validPts.length > 0) {
      const coords = validPts.map(p => `${getX(p.idx)},${getY(p.val)}`);
      pathsSvg += `<polyline fill="none" stroke="${line.color}" stroke-width="3" points="${coords.join(" ")}" />`;
      validPts.forEach(p => {
        const cx = getX(p.idx);
        const cy = getY(p.val);
        pathsSvg += `
          <g style="cursor:pointer;" onclick="event.stopPropagation(); openKpiStatsTable(${p.idx}, '${line.key}', '${line.label}')">
            <circle cx="${cx}" cy="${cy}" r="6" fill="${line.color}" stroke="#ffffff" stroke-width="1.5" />
            <text x="${cx}" y="${cy - 9}" text-anchor="middle" font-size="11" font-weight="700" fill="${line.color}">${p.val.toFixed(1)}</text>
          </g>
        `;
      });
    }
  });

  const xAxisSvg = labels.map((lbl, i) => {
    const xPos = getX(i);
    return `<text x="${xPos}" y="${svgH - 12}" text-anchor="middle" font-size="12" font-weight="700" fill="#334155" style="cursor:pointer;" onclick="event.stopPropagation(); openKpiStatsTable(${i})">${lbl}</text>`;
  }).join("");

  const legendHtml = linesData.map(l => `
    <span class="line-legend-item">
      <span class="line-swatch" style="background:${l.color};"></span>
      <span>${l.label}</span>
    </span>
  `).join("");

  document.getElementById("appMain").innerHTML = `
    <div class="view-container">
      <div class="view-header">
        <div class="view-title">BIỂU ĐỒ ĐƯỜNG ${kpiLabel.toUpperCase()} - ${modeTitleMap[mode]}</div>
        <button class="btn btn-ok" onclick="popView()">OK</button>
      </div>

      <div class="filter-bar">
        <span class="fw-bold" style="font-size:13px;">Chế độ xem:</span>
        <button class="mode-btn ${mode === 'overview' ? 'active' : ''}" onclick="updateKpiLineFilter('overview')">TỔNG QUAN</button>
        <button class="mode-btn ${mode === 'year' ? 'active' : ''}" onclick="updateKpiLineFilter('year')">NĂM</button>
        <button class="mode-btn ${mode === 'month' ? 'active' : ''}" onclick="updateKpiLineFilter('month')">THÁNG</button>
        <button class="mode-btn ${mode === 'week' ? 'active' : ''}" onclick="updateKpiLineFilter('week')">TUẦN</button>
        <button class="mode-btn ${mode === 'date' ? 'active' : ''}" onclick="updateKpiLineFilter('date')">NGÀY</button>
        <span style="margin-left:12px;font-size:13px;font-weight:700;">Từ ngày:</span>
        <input type="date" id="kpiFromDate" class="date-input" value="${fromDate}" onchange="applyKpiCustomDateRange()" />
        <span style="font-size:13px;font-weight:700;">Đến ngày:</span>
        <input type="date" id="kpiToDate" class="date-input" value="${toDate}" onchange="applyKpiCustomDateRange()" />
        
      </div>

      <div class="chart-canvas-box" style="justify-content:flex-start;">
        <div class="line-legend">${legendHtml} <span style="margin-left:auto;color:#64748b;font-weight:600;">(Click vào biểu đồ để xem bảng thống kê chi tiết)</span></div>
        <svg viewBox="0 0 ${svgW} ${svgH}" style="width:100%; height:420px; cursor:pointer;" onclick="openKpiStatsTable(0)">
          ${gridSvg}
          <line x1="${padL}" y1="${padT + plotH}" x2="${svgW - padR}" y2="${padT + plotH}" stroke="#94a3b8" stroke-width="2" />
          <line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT + plotH}" stroke="#94a3b8" stroke-width="2" />
          ${pathsSvg}
          ${xAxisSvg}
        </svg>
      </div>
    </div>
  `;
}

function updateKpiLineFilter(newMode) {
  const current = viewStack[viewStack.length - 1];
  current.state.mode = newMode;
  renderKpiLineChart(current.state);
}

function applyKpiCustomDateRange() {
  const current = viewStack[viewStack.length - 1];
  current.state.fromDate = document.getElementById("kpiFromDate").value;
  current.state.toDate = document.getElementById("kpiToDate").value;
  if ((current.state.fromDate || current.state.toDate) && current.state.mode === "overview") {
    current.state.mode = "date";
  }
  renderKpiLineChart(current.state);
}

function resetKpiCustomDateRange() {
  const current = viewStack[viewStack.length - 1];
  current.state.fromDate = "";
  current.state.toDate = "";
  renderKpiLineChart(current.state);
}

function openKpiStatsTable(selectedIdx, selectedKey = "", selectedLabel = "") {
  const current = viewStack[viewStack.length - 1];
  const { kpiType, kpiLabel, currentLabels, currentLinesData } = current.state;
  const lines = currentLinesData || [];
  const defaultLine = lines[lines.length - 1] || null;

  pushView(renderKpiStatsTable, {
    kpiType,
    kpiLabel,
    labels: currentLabels || [],
    linesData: lines,
    selectedIdx: selectedIdx || 0,
    selectedKey: selectedKey || (defaultLine ? defaultLine.key : ""),
    selectedLabel: selectedLabel || (defaultLine ? defaultLine.label : "TỔNG")
  });
}

function selectKpiStatsSeries(seriesKey) {
  const current = viewStack[viewStack.length - 1];
  const foundLine = (current.state.linesData || []).find(l => l.key === seriesKey);
  if (foundLine) {
    current.state.selectedKey = foundLine.key;
    current.state.selectedLabel = foundLine.label;
    renderKpiStatsTable(current.state);
  }
}

function handleKpiExcelUpload(event) {
  const file = event.target.files[0];
  const fb = document.getElementById("saveFeedback");
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: "array" });

      const targetSheetName = workbook.SheetNames.find(n =>
        n.toLowerCase().includes("sale person theo item")
      ) || workbook.SheetNames[0];

      const parsedSections = parseKpiSheet(workbook.Sheets[targetSheetName]);
      KPI_DB = {
        version: 1,
        sections: parsedSections,
        targets: KPI_DB?.targets || { sub_week: 28, total_week: 30, next_week_target: "30" }
      };
      localStorage.setItem("SR_SUB_KPI_DB", JSON.stringify(KPI_DB));
      await syncToServer();

      if (fb) {
        fb.style.display = "block";
        fb.style.background = "#dcfce7";
        fb.style.color = "#15803d";
        fb.textContent = `Đã lưu dữ liệu KPI lên server từ file ${file.name} (sheet: ${targetSheetName})!`;
      }
      switchTab("tab2");
    } catch (err) {
      console.error(err);
      if (fb) {
        fb.style.display = "block";
        fb.style.background = "#fee2e2";
        fb.style.color = "#b91c1c";
        fb.textContent = "Lỗi khi đọc/lưu Dữ liệu gốc KPI: " + err.message;
      }
    }
  };
  reader.readAsArrayBuffer(file);
}

function normalizePoRows(sheet) {
  const rows = XLSX.utils.sheet_to_json(sheet);
  return rows.map(row => {
    const rawDate = row["Plan Date"] || row["Plan date"] || row["plan date"];
    let isoDate = "";
    if (typeof rawDate === "number") {
      const d = new Date(Math.floor(rawDate - 25569) * 86400 * 1000);
      isoDate = `${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, "0")}-${String(d.getUTCDate()).padStart(2, "0")}`;
    } else if (rawDate) {
      const s = String(rawDate).trim();
      if (/^\d{4}-\d{2}-\d{2}/.test(s)) isoDate = s.slice(0, 10);
      else {
        const d = new Date(s);
        if (!isNaN(d)) {
          isoDate = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
        }
      }
    }
    return { ...row, _normPlanDate: isoDate };
  });
}

function handleMasterExcelUpload(event) {
  const file = event.target.files[0];
  const fb = document.getElementById("saveFeedback");
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: "array" });

      let updatedCount = 0;
      workbook.SheetNames.forEach(sheetName => {
        const sheet = workbook.Sheets[sheetName];
        const lowerName = sheetName.toLowerCase().trim();

        if (lowerName.startsWith("po") || lowerName.includes("po ")) {
          const poRows = normalizePoRows(sheet);
          if (lowerName.includes("ontime")) {
            DB.po_ontime = poRows;
            updatedCount++;
          } else if (lowerName.includes("ckd") || lowerName.includes("pcell")) {
            DB.po_ckd_pcell = poRows;
            updatedCount++;
          } else if (lowerName.includes("svc")) {
            DB.po_svc = poRows;
            updatedCount++;
          }
          return;
        }

        const parsedJson = parseHorizontalSheet(sheet);
        if (parsedJson.length > 0) {
          if (lowerName.includes("ontime")) {
            DB.ontime = parsedJson;
            updatedCount++;
          } else if (lowerName.includes("ckd") || lowerName.includes("pcell")) {
            DB.ckd_pcell = parsedJson;
            updatedCount++;
          } else if (lowerName.includes("ml svc") || lowerName.includes("ml_svc")) {
            DB.ml_svc = parsedJson;
            updatedCount++;
          }
        }
      });

      localStorage.setItem("SR_SUB_OFFLINE_DB", JSON.stringify(DB));
      await syncToServer();
      if (fb) {
        fb.style.display = "block";
        fb.style.background = "#dcfce7";
        fb.style.color = "#15803d";
        fb.textContent = `Đã lưu dữ liệu tổng lên server từ file ${file.name} (${updatedCount} sheet khớp)!`;
      }
      switchTab("tab1");
    } catch (err) {
      console.error(err);
      if (fb) {
        fb.style.display = "block";
        fb.style.background = "#fee2e2";
        fb.style.color = "#b91c1c";
        fb.textContent = "Lỗi khi đọc/lưu file Excel tổng: " + err.message;
      }
    }
  };
  reader.readAsArrayBuffer(file);
}

function handleCategoryExcelUpload(catKey, event) {
  const file = event.target.files[0];
  const fb = document.getElementById("saveFeedback");
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: "array" });
      const firstSheetName = workbook.SheetNames[0];
      const sheet = workbook.Sheets[firstSheetName];
      const parsedJson = parseHorizontalSheet(sheet);

      if (parsedJson.length > 0) {
        DB[catKey] = parsedJson;
        localStorage.setItem("SR_SUB_OFFLINE_DB", JSON.stringify(DB));
        await syncToServer();
        if (fb) {
          fb.style.display = "block";
          fb.style.background = "#dcfce7";
          fb.style.color = "#15803d";
          fb.textContent = `Đã lưu lên server dữ liệu mục [${catKey}] từ file ${file.name} (${parsedJson.length} ngày)!`;
        }
        switchTab("tab1");
      } else {
        throw new Error("Sheet Excel trống hoặc không có dữ liệu hợp lệ.");
      }
    } catch (err) {
      console.error(err);
      if (fb) {
        fb.style.display = "block";
        fb.style.background = "#fee2e2";
        fb.style.color = "#b91c1c";
        fb.textContent = "Lỗi khi đọc/lưu file Excel hạng mục: " + err.message;
      }
    }
  };
  reader.readAsArrayBuffer(file);
}
async function handleSaveInput() {
  const dateVal = document.getElementById("inputDate").value;
  const fb = document.getElementById("saveFeedback");
  if (!dateVal) {
    fb.style.display = "block";
    fb.style.background = "#fee2e2";
    fb.style.color = "#b91c1c";
    fb.textContent = "Vui lòng chọn ngày trước khi lưu!";
    return;
  }

  const payload = {
    date: dateVal,
    entries: {
      ontime: {
        plan: document.getElementById("plan_ontime").value,
        ok: document.getElementById("ok_ontime").value
      },
      ckd_pcell: {
        plan: document.getElementById("plan_ckd_pcell").value,
        ok: document.getElementById("ok_ckd_pcell").value
      },
      ml_svc: {
        plan: document.getElementById("plan_ml_svc").value,
        ok: document.getElementById("ok_ml_svc").value
      }
    }
  };

  const dt = new Date(dateVal);
  const yr = dt.getFullYear();
  const mo = dt.getMonth() + 1;
  const wk = Math.ceil((((dt - new Date(yr, 0, 1)) / 86400000) + new Date(yr, 0, 1).getDay() + 1) / 7);

  Object.entries(payload.entries).forEach(([key, val]) => {
    if (val.plan !== "" && val.ok !== "") {
      const p = Number(val.plan);
      const o = Number(val.ok);
      if (!DB[key]) DB[key] = [];
      const idx = DB[key].findIndex(r => r.date === dateVal);
      const rec = {
        year: yr,
        month: mo,
        week: wk,
        date: dateVal,
        dow: dt.toLocaleDateString("en-US", { weekday: "short" }),
        plan: p,
        ok: o,
        ng: p - o,
        rate: p > 0 ? o / p : null,
        status: "ON"
      };
      if (idx >= 0) DB[key][idx] = rec;
      else DB[key].push(rec);
    }
  });
  localStorage.setItem("SR_SUB_OFFLINE_DB", JSON.stringify(DB));

  if (!KPI_DB) KPI_DB = loadKpiFromStorageOrFallback();
  const tSub = document.getElementById("target_sub_sp")?.value;
  const vSub = document.getElementById("val_sub_sp")?.value;
  const tTot = document.getElementById("target_total_sp")?.value;
  const vTot = document.getElementById("val_total_sp")?.value;
  let kpiChanged = false;

  if (tSub !== undefined && tSub !== "") { KPI_DB.targets.sub_week = Number(tSub); kpiChanged = true; }
  if (tTot !== undefined && tTot !== "") { KPI_DB.targets.total_week = Number(tTot); kpiChanged = true; }

  const upsertKpiDay = (secKey, spVal) => {
    if (!KPI_DB.sections[secKey]) KPI_DB.sections[secKey] = [];
    const arr = KPI_DB.sections[secKey];
    const idx = arr.findIndex(r => r.colType === "day" && r.date === dateVal);
    const item = {
      colType: "day",
      year: yr,
      month: mo,
      week: wk,
      date: dateVal,
      label: dateVal.slice(5),
      salesPerson: Number(spVal),
      labor: 0,
      qty: 0,
      st: 0,
      sales: 0
    };
    if (idx >= 0) arr[idx] = item;
    else arr.push(item);
  };

  if (vSub !== undefined && vSub !== "") { upsertKpiDay("SUB", vSub); kpiChanged = true; }
  if (vTot !== undefined && vTot !== "") { upsertKpiDay("G_TOTAL", vTot); kpiChanged = true; }

  if (kpiChanged) {
    localStorage.setItem("SR_SUB_KPI_DB", JSON.stringify(KPI_DB));
  }

  try {
    await syncToServer();
    fb.style.display = "block";
    fb.style.background = "#dcfce7";
    fb.style.color = "#15803d";
    fb.textContent = "Đã lưu dữ liệu lên server thành công!";
  } catch (err) {
    fb.style.display = "block";
    fb.style.background = "#fef3c7";
    fb.style.color = "#b45309";
    fb.textContent = "Đã lưu tạm local, nhưng gửi lên server lỗi: " + err.message;
  }
  switchTab(kpiChanged ? "tab2" : "tab1");
}

  };

  // Sắp xếp khóa dài trước để ưu tiên khớp cụm từ dài
  const SORTED_KEYS = Object.keys(DICT_VI_TO_KO).sort((a, b) => b.length - a.length);

  const originalTextMap = new WeakMap();
  const originalAttrMap = new WeakMap();

  let currentLang = localStorage.getItem(STORAGE_KEY) || "vi";
  let isMutating = false;
  let observerTimer = null;

  function escapeRegExp(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  }

  function translateTextSync(rawText) {
    if (!rawText || !rawText.trim()) return rawText;

    const leading = (rawText.match(/^\s*/) || [""])[0];
    const trailing = (rawText.match(/\s*$/) || [""])[0];
    const core = rawText.trim();

    // Khớp chính xác toàn bộ chuỗi
    if (DICT_VI_TO_KO[core]) {
      return leading + DICT_VI_TO_KO[core] + trailing;
    }

    // Khớp không phân biệt hoa thường
    const lowerCore = core.toLowerCase();
    for (const k of SORTED_KEYS) {
      if (k.toLowerCase() === lowerCore) {
        return leading + DICT_VI_TO_KO[k] + trailing;
      }
    }

    // Thay thế cụm từ con nếu có chứa tiếng Việt
    if (/[À-ỹ]/.test(core)) {
      let replaced = core;
      for (const k of SORTED_KEYS) {
        if (!/[À-ỹ]/.test(k)) continue;
        const regex = new RegExp(escapeRegExp(k), "gi");
        replaced = replaced.replace(regex, DICT_VI_TO_KO[k]);
      }
      return leading + replaced + trailing;
    }

    return rawText;
  }

  function shouldSkipNode(node) {
    const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
    if (!el) return true;
    return Boolean(
      el.closest("#i18nSwitcherBox") ||
      el.closest("script, style, noscript, textarea, select, code, pre, [data-no-i18n], [data-input-template]") ||
      el.isContentEditable
    );
  }

  function processTextNode(node, lang) {
    if (shouldSkipNode(node)) return;

    if (!originalTextMap.has(node)) {
      originalTextMap.set(node, node.nodeValue);
    }
    const viOriginal = originalTextMap.get(node);

    const targetValue = lang === "vi" ? viOriginal : translateTextSync(viOriginal);
    if (node.nodeValue !== targetValue) {
      node.nodeValue = targetValue;
    }
  }

  function processAttributes(el, lang) {
    if (shouldSkipNode(el)) return;
    const attrs = ["placeholder", "title", "aria-label"];

    if (!originalAttrMap.has(el)) {
      const saved = {};
      attrs.forEach((a) => {
        if (el.hasAttribute(a)) saved[a] = el.getAttribute(a);
      });
      originalAttrMap.set(el, saved);
    }

    const saved = originalAttrMap.get(el);
    for (const a of attrs) {
      if (!(a in saved)) continue;
      const viVal = saved[a];
      const targetVal = lang === "vi" ? viVal : translateTextSync(viVal);
      if (el.getAttribute(a) !== targetVal) {
        el.setAttribute(a, targetVal);
      }
    }
  }

  function applyLanguageToRoot(root, lang) {
    if (!root) return;
    isMutating = true;
    try {
      if (root.nodeType === Node.TEXT_NODE) {
        processTextNode(root, lang);
        return;
      }
      if (root.nodeType === Node.ELEMENT_NODE) {
        processAttributes(root, lang);
      }

      const walker = document.createTreeWalker(
        root,
        NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT,
        null
      );

      let current;
      while ((current = walker.nextNode())) {
        if (current.nodeType === Node.TEXT_NODE) {
          processTextNode(current, lang);
        } else if (current.nodeType === Node.ELEMENT_NODE) {
          processAttributes(current, lang);
        }
      }
    } finally {
      isMutating = false;
    }
  }

  function updateSwitcherUI(lang) {
    const isKo = lang === "ko";
    const tabVi = document.getElementById("i18nTabVi");
    const tabKo = document.getElementById("i18nTabKo");

    if (tabVi) {
      tabVi.classList.toggle("is-active", !isKo);
      tabVi.setAttribute("aria-selected", String(!isKo));
    }
    if (tabKo) {
      tabKo.classList.toggle("is-active", isKo);
      tabKo.setAttribute("aria-selected", String(isKo));
    }

    document.documentElement.setAttribute("lang", lang);
  }

  function setLanguage(lang) {
    if (lang !== "vi" && lang !== "ko") lang = "vi";
    currentLang = lang;
    localStorage.setItem(STORAGE_KEY, currentLang);
    updateSwitcherUI(currentLang);
    applyLanguageToRoot(document.body, currentLang);
  }

  const observer = new MutationObserver(() => {
    if (isMutating || currentLang === "vi") return;
    clearTimeout(observerTimer);
    observerTimer = setTimeout(() => {
      applyLanguageToRoot(document.body, currentLang);
    }, 50);
  });

  function initI18n() {
    document.querySelectorAll("#i18nSwitcherBox .i18n-lang-tab").forEach((btn) => {
      btn.addEventListener("click", () => {
        const targetLang = btn.getAttribute("data-lang");
        if (targetLang && targetLang !== currentLang) {
          setLanguage(targetLang);
        }
      });
    });

    observer.observe(document.body, {
      childList: true,
      subtree: true
    });

    setLanguage(currentLang);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", initI18n);
  } else {
    initI18n();
  }
})();
</script>

</body>
</html>
