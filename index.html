<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SR TECH SUB — Cloud Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #0f172a; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { height: 38px; border-radius: 6px; object-fit: contain; background: #fff; padding: 2px; }
    .toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
    button, label.btn { background: #2563eb; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    button.secondary, label.btn.secondary { background: #334155; }
    button:hover, label.btn:hover { opacity: 0.92; }
    main { max-width: 1280px; margin: 20px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; padding: 18px; margin-bottom: 18px; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    h2 { margin: 0 0 12px; font-size: 17px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { border: 1px solid #e2e8f0; padding: 8px 10px; text-align: left; }
    th { background: #f1f5f9; font-weight: 600; }
    .muted { color: #64748b; font-size: 13px; }
    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo.jpg" alt="Logo" onerror="this.style.display='none'" />
      <div>
        <div style="font-weight:700;font-size:16px;">SR TECH SUB — CLOUD DASHBOARD</div>
        <div class="muted" id="syncStatus">Đang tải dữ liệu data.json & kpi_data.json...</div>
      </div>
    </div>
    <div class="toolbar">
      <label class="btn secondary">Import Excel (.xlsx)
        <input type="file" id="excelInput" accept=".xlsx,.xls" />
      </label>
      <button class="secondary" onclick="exportJsonFile('data.json', state.ranking)">Xuất data.json</button>
      <button class="secondary" onclick="exportJsonFile('kpi_data.json', state.kpi)">Xuất kpi_data.json</button>
      <button onclick="resetToCloudJson()">Khôi phục Cloud JSON</button>
    </div>
  </header>

  <main>
    <div class="card">
      <h2>1. Dữ liệu Ranking (ontime / ckd_pcell / ml_svc)</h2>
      <div id="rankingTableWrap" class="muted">Đang tải...</div>
    </div>
    <div class="card">
      <h2>2. Dữ liệu KPI SX SUB (FRONT / PRE_FRONT / BGL_SUB_UB / OTHER / SUB)</h2>
      <div id="kpiTableWrap" class="muted">Đang tải...</div>
    </div>
  </main>

  <script>
    const STORAGE_KEY_RANKING = "SR_TECH_SUB_RANKING_V1";
    const STORAGE_KEY_KPI = "SR_TECH_SUB_KPI_V1";
    let state = { ranking: null, kpi: null };

    async function loadInitialData() {
      let rankingData = null;
      let kpiData = null;

      try {
        const resR = await fetch("./data.json?t=" + Date.now());
        if (resR.ok) rankingData = await resR.json();
      } catch (e) { console.warn("Không fetch được data.json:", e); }

      try {
        const resK = await fetch("./kpi_data.json?t=" + Date.now());
        if (resK.ok) kpiData = await resK.json();
      } catch (e) { console.warn("Không fetch được kpi_data.json:", e); }

      const localR = localStorage.getItem(STORAGE_KEY_RANKING);
      const localK = localStorage.getItem(STORAGE_KEY_KPI);

      state.ranking = localR ? JSON.parse(localR) : (rankingData || {});
      state.kpi = localK ? JSON.parse(localK) : (kpiData || {});

      document.getElementById("syncStatus").textContent =
        (localR || localK)
          ? "Đang dùng bản nháp localStorage (nhớ Xuất JSON để cập nhật lên đám mây)"
          : "Đã đồng bộ trực tiếp từ data.json & kpi_data.json";

      renderTables();
    }

    function saveLocal() {
      localStorage.setItem(STORAGE_KEY_RANKING, JSON.stringify(state.ranking));
      localStorage.setItem(STORAGE_KEY_KPI, JSON.stringify(state.kpi));
      document.getElementById("syncStatus").textContent =
        "Đã lưu localStorage — hãy bấm Xuất JSON rồi push lên GitHub/Cloud";
    }

    function exportJsonFile(filename, payload) {
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function resetToCloudJson() {
      localStorage.removeItem(STORAGE_KEY_RANKING);
      localStorage.removeItem(STORAGE_KEY_KPI);
      await loadInitialData();
    }

    function renderTables() {
      const rRows = (state.ranking && state.ranking.ontime) || [];
      document.getElementById("rankingTableWrap").innerHTML = rRows.length
        ? `<table><thead><tr>${Object.keys(rRows[0]).map(k => `<th>${k}</th>`).join("")}</tr></thead><tbody>${
            rRows.map(row => `<tr>${Object.values(row).map(v => `<td>${v ?? ""}</td>`).join("")}</tr>`).join("")
          }</tbody></table>`
        : `<div class="muted">Chưa có bản ghi ontime trong data.json</div>`;

      const subRows = (state.kpi && state.kpi.SUB) || [];
      document.getElementById("kpiTableWrap").innerHTML = subRows.length
        ? `<table><thead><tr>${Object.keys(subRows[0]).map(k => `<th>${k}</th>`).join("")}</tr></thead><tbody>${
            subRows.map(row => `<tr>${Object.values(row).map(v => `<td>${v ?? ""}</td>`).join("")}</tr>`).join("")
          }</tbody></table>`
        : `<div class="muted">Chưa có bản ghi SUB trong kpi_data.json</div>`;
    }

    document.getElementById("excelInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const buf = await file.arrayBuffer();
      const wb = XLSX.read(buf, { type: "array" });
      const firstSheet = wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[firstSheet], { defval: "" });
      if (rows.length && "colType" in rows[0]) {
        state.kpi[firstSheet] = rows;
      } else if (rows.length) {
        state.ranking[firstSheet] = rows;
      }
      saveLocal();
      renderTables();
    });

    loadInitialData();
  </script>
</body>
</html>
